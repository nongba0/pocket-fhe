name: Pocket-FHE CI Pipeline & Seed Sweep Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cpp-verification:
    name: Build & Verify C++ FHE Kernels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up GCC Compiler
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile C++ Verification Targets
        run: |
          g++ -O3 -std=c++17 src/arm_glue.cpp -o src/arm_glue_native
          g++ -O3 -std=c++17 src/e2e_pipeline.cpp -o src/e2e_pipeline_native
          g++ -O3 -std=c++17 src/test_homomorphic_computation.cpp -o src/test_homomorphic_computation_native
          g++ -O3 -std=c++17 src/biometric_pipeline.cpp -o src/biometric_pipeline_native

      - name: Execute Native C++ Verification Tests
        run: |
          ./src/arm_glue_native
          ./src/e2e_pipeline_native
          ./src/test_homomorphic_computation_native
          ./src/biometric_pipeline_native

  node-seed-sweep:
    name: Node.js Sweep — homomorphic distance must equal plaintext distance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Correctness Verification Sweep
        run: node demo/test_node.js
